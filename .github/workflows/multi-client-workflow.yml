name: Multi-Client Lead Finder

on:
  schedule:
    # Runs every day at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      single_client:
        description: 'Run for one specific client_id only (leave blank to run all active clients)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-for-all-clients:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl beautifulsoup4

      - name: Run lead finder for each active client
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          BREVO_USERNAME: ${{ secrets.BREVO_USERNAME }}
          BREVO_PASSWORD: ${{ secrets.BREVO_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SINGLE_CLIENT_OVERRIDE: ${{ inputs.single_client }}
        run: |
          python3 << 'PYEOF'
          import json
          import subprocess
          import os

          with open("clients_registry.json", "r", encoding="utf-8") as f:
              registry = json.load(f)

          single_client = os.environ.get("SINGLE_CLIENT_OVERRIDE", "").strip()

          if single_client:
              # Manual run targeting just one client, for testing
              client_ids_to_run = [single_client] if single_client in registry else []
              if not client_ids_to_run:
                  print(f"ERROR: '{single_client}' not found in registry.")
          else:
              # Normal scheduled run — every active client, one at a time
              client_ids_to_run = [
                  cid for cid, settings in registry.items()
                  if settings.get("active", True)
              ]

          print(f"Running for {len(client_ids_to_run)} client(s): {client_ids_to_run}")

          for client_id in client_ids_to_run:
              print(f"\n{'='*50}\nStarting run for: {client_id}\n{'='*50}")
              result = subprocess.run(
                  ["python3", "multi_client_lead_finder.py", client_id],
                  capture_output=False
              )
              if result.returncode != 0:
                  print(f"WARNING: run for '{client_id}' exited with an error "
                        f"— continuing to the next client rather than stopping everyone.")
          PYEOF

      - name: Commit updated client data
        run: |
          git config user.name "lead-finder-bot"
          git config user.email "actions@github.com"
          git add client_data/
          git diff --cached --quiet || git commit -m "Update client lead data [skip ci]"
          git push
